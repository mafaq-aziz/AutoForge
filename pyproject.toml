[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.1.0"
description = "Open-source, AI-native automobile company simulator for education and research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoForge contributors" }]
keywords = ["simulation", "automotive", "ev", "bms", "adas", "factory", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/mafaq-aziz/AutoForge"

[tool.setuptools.packages.find]
include = ["autoforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["autoforge", "autoforge/tests", "autoforge/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501", # line length handled by formatter; long docstrings are acceptable
    "SIM108", # ternary via if/else is clearer in many places
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["autoforge/tests"]
addopts = "-q"
